<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>License Configuration Diff Tool</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --add-bg: #f0fdf4;
            --add-border: #86efac;
            --add-text: #166534;
            --remove-bg: #fef2f2;
            --remove-border: #fca5a5;
            --remove-text: #991b1b;
            --mod-bg: #fefce8;
            --mod-border: #fde047;
            --mod-text: #854d0e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 24px;
        }

        .container { max-width: 1200px; margin: 0 auto; }
        h1 { font-size: 1.5rem; margin-bottom: 8px; }
        p.subtitle { color: var(--text-secondary); margin-bottom: 24px; font-size: 0.9rem; }

        .editor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }

        .editor-box { display: flex; flex-direction: column; }
        .editor-box label { font-weight: 600; font-size: 0.85rem; margin-bottom: 6px; }

        textarea {
            width: 100%;
            height: 280px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            font-family: monospace;
            font-size: 0.85rem;
            resize: vertical;
            background-color: var(--card-bg);
        }

        .btn-bar { display: flex; gap: 12px; margin-bottom: 24px; }

        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
        }

        button:hover { background-color: #1d4ed8; }
        button.secondary { background-color: #e2e8f0; color: var(--text-primary); }
        button.secondary:hover { background-color: #cbd5e1; }

        .results { display: flex; flex-direction: column; gap: 16px; }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
        }

        .card h3 { font-size: 1rem; margin-top: 0; margin-bottom: 12px; }

        .diff-list { list-style: none; padding: 0; margin: 0; font-family: monospace; font-size: 0.85rem; }
        .diff-item { padding: 6px 10px; border-radius: 4px; margin-bottom: 4px; display: flex; gap: 8px; }
        
        .added { background-color: var(--add-bg); border: 1px solid var(--add-border); color: var(--add-text); }
        .removed { background-color: var(--remove-bg); border: 1px solid var(--remove-border); color: var(--remove-text); }
        .modified { background-color: var(--mod-bg); border: 1px solid var(--mod-border); color: var(--mod-text); }

        .badge {
            font-size: 0.75rem;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>License Configuration Diff Tool</h1>
    <p class="subtitle">Paste Old and New configuration text blocks side-by-side to compare metadata and package item changes.</p>

    <div class="editor-grid">
        <div class="editor-box">
            <label for="oldText">OLD Configuration</label>
            <textarea id="oldText" placeholder="Paste OLD configuration here..."></textarea>
        </div>
        <div class="editor-box">
            <label for="newText">NEW Configuration</label>
            <textarea id="newText" placeholder="Paste NEW configuration here..."></textarea>
        </div>
    </div>

    <div class="btn-bar">
        <button onclick="compareConfigs()">Compare Configurations</button>
        <button class="secondary" onclick="clearAll()">Clear</button>
    </div>

    <div id="results" class="results"></div>
</div>
<script>
function parseConfig(text) {
    const data = { 
        header: {}, 
        jurisMap: {}, 
        packages: {}, 
        packageFeatures: {}, 
        packageJuris: {}, 
        packageUsers: {}, 
        packageIds: {} 
    };
    const lines = text.split(/\r?\n/);
    let currentPkg = null;
    let lastHeaderKey = null;

    // Helper to normalize keys so "Agency Name" matches "AgencyName", 
    // and "Created Date" matches "CreatedDttm"
    function normalizeKey(key) {
        let norm = key.replace(/\s+/g, ''); // Remove all spaces
        norm = norm.replace(/Date$/, 'Dttm'); // Convert "Date" suffix to "Dttm"
        return norm;
    }

    lines.forEach(line => {
        const trimmed = line.trim();
        if (!trimmed) return;

        // Fix 1: Ignore the standalone "Packages" line so it doesn't append to the last header
        if (trimmed === 'Packages') {
            lastHeaderKey = null;
            return;
        }

        if (trimmed.startsWith('Packages Name =')) {
            currentPkg = trimmed.split('=')[1].trim();
            lastHeaderKey = null;
            if (!data.packages[currentPkg]) {
                data.packages[currentPkg] = true;
                data.packageFeatures[currentPkg] = {};
                data.packageJuris[currentPkg] = new Set();
            }
        } else if (trimmed.startsWith('Packages ID =') && currentPkg) {
            data.packageIds[currentPkg] = trimmed.split('=')[1].trim();
        } else if (trimmed.startsWith('No. of User =') && currentPkg) {
            data.packageUsers[currentPkg] = trimmed.split('=')[1].trim();
        } else if (trimmed.startsWith('Package Juris =') && currentPkg) {
            const match = trimmed.match(/<([^>]*)>/);
            if (match && match[1]) {
                match[1].split(',').forEach(id => {
                    if (id.trim()) data.packageJuris[currentPkg].add(id.trim());
                });
            }
        } else if (/^(\d+)\s*-\s*(.+)/.test(trimmed) && currentPkg) {
            const match = trimmed.match(/^(\d+)\s*-\s*(.+)/);
            const code = match[1];
            const desc = match[2].trim();
            data.packageFeatures[currentPkg][code] = desc;
        } else if (trimmed.includes('=')) {
            currentPkg = null;
            const eqIdx = trimmed.indexOf('=');
            
            // Fix 2: Normalize the key before saving it
            const rawKey = trimmed.substring(0, eqIdx).trim();
            const key = normalizeKey(rawKey); 
            
            const val = trimmed.substring(eqIdx + 1).trim();
            data.header[key] = val;
            lastHeaderKey = key;
        } else if (lastHeaderKey && !currentPkg) {
            data.header[lastHeaderKey] += " " + trimmed;
        }
    });

    if (data.header['Juris']) {
        const rawJuris = data.header['Juris'];
        const entries = rawJuris.split(',');
        entries.forEach(entry => {
            const trimmedEntry = entry.trim();
            if (trimmedEntry.includes('*')) {
                const parts = trimmedEntry.split('*');
                const id = parts[0].trim();
                const name = parts.slice(1).join('*').trim();
                data.jurisMap[id] = name;
            } else if (trimmedEntry) {
                data.jurisMap[trimmedEntry] = '';
            }
        });
    }

    return data;
}
function compareConfigs() {
    const oldText = document.getElementById('oldText').value;
    const newText = document.getElementById('newText').value;
    const resultsDiv = document.getElementById('results');
    resultsDiv.innerHTML = '';

    if (!oldText || !newText) {
        resultsDiv.innerHTML = '<div class="card"><p>Please populate both OLD and NEW text fields to run a comparison.</p></div>';
        return;
    }

    const oldData = parseConfig(oldText);
    const newData = parseConfig(newText);

    let html = '';

    // 1. Header Metadata Differences
    const headerKeys = new Set([...Object.keys(oldData.header), ...Object.keys(newData.header)]);
    headerKeys.delete('Juris');
    const headerDiffs = [];

    headerKeys.forEach(key => {
        const oldVal = oldData.header[key];
        const newVal = newData.header[key];
        if (oldVal !== newVal) {
            headerDiffs.push({ key, oldVal: oldVal || '<i>(none)</i>', newVal: newVal || '<i>(none)</i>' });
        }
    });

    if (headerDiffs.length > 0) {
        html += `<div class="card"><h3>Header Metadata Changes</h3><ul class="diff-list">`;
        headerDiffs.forEach(d => {
            html += `<li class="diff-item modified"><span class="badge">CHANGED</span> <strong>${d.key}:</strong> ${d.oldVal} &rarr; ${d.newVal}</li>`;
        });
        html += `</ul></div>`;
    }

    // 2. Top-Level Jurisdiction Changes
    const allJurisIds = new Set([...Object.keys(oldData.jurisMap), ...Object.keys(newData.jurisMap)]);
    const jurisDiffs = [];

    allJurisIds.forEach(id => {
        const oldName = oldData.jurisMap[id];
        const newName = newData.jurisMap[id];

        if (oldName === undefined) {
            jurisDiffs.push(`<li class="diff-item added"><span class="badge">+ JURIS ADDED</span> ID <strong>${id}</strong>: ${newName}</li>`);
        } else if (newName === undefined) {
            jurisDiffs.push(`<li class="diff-item removed"><span class="badge">- JURIS REMOVED</span> ID <strong>${id}</strong>: ${oldName}</li>`);
        } else if (oldName !== newName) {
            jurisDiffs.push(`<li class="diff-item modified"><span class="badge">NAME CHANGED</span> ID <strong>${id}</strong>: ${oldName} &rarr; ${newName}</li>`);
        }
    });

    if (jurisDiffs.length > 0) {
        html += `<div class="card"><h3>Top-Level Jurisdiction Changes</h3><ul class="diff-list">`;
        jurisDiffs.forEach(diff => html += diff);
        html += `</ul></div>`;
    }

    // 3. Package & Feature Code Differences
    const allPkgs = new Set([...Object.keys(oldData.packages), ...Object.keys(newData.packages)]);
    
    allPkgs.forEach(pkg => {
        if (!oldData.packages[pkg]) {
            html += `<div class="card"><h3>Package Added: ${pkg}</h3><ul class="diff-list">`;
            if (newData.packageUsers[pkg]) {
                html += `<li class="diff-item added"><span class="badge">+</span> No. of User = ${newData.packageUsers[pkg]}</li>`;
            }
            const newFeats = newData.packageFeatures[pkg] || {};
            Object.keys(newFeats).forEach(code => {
                html += `<li class="diff-item added"><span class="badge">+</span> ${code} - ${newFeats[code]}</li>`;
            });
            html += `</ul></div>`;
        } else if (!newData.packages[pkg]) {
            html += `<div class="card"><h3>Package Removed: ${pkg}</h3><ul class="diff-list">`;
            const oldFeats = oldData.packageFeatures[pkg] || {};
            Object.keys(oldFeats).forEach(code => {
                html += `<li class="diff-item removed"><span class="badge">-</span> ${code} - ${oldFeats[code]}</li>`;
            });
            html += `</ul></div>`;
        } else {
            const oldFeats = oldData.packageFeatures[pkg] || {};
            const newFeats = newData.packageFeatures[pkg] || {};
            
            const allCodes = new Set([...Object.keys(oldFeats), ...Object.keys(newFeats)]);
            const featureDiffs = [];

            allCodes.forEach(code => {
                const oldDesc = oldFeats[code];
                const newDesc = newFeats[code];

                if (oldDesc === undefined) {
                    featureDiffs.push(`<li class="diff-item added"><span class="badge">+ ADDED</span> ${code} - ${newDesc}</li>`);
                } else if (newDesc === undefined) {
                    featureDiffs.push(`<li class="diff-item removed"><span class="badge">- REMOVED</span> ${code} - ${oldDesc}</li>`);
                } else if (oldDesc !== newDesc) {
                    featureDiffs.push(`<li class="diff-item modified"><span class="badge">CHANGED</span> ${code} - ${oldDesc} &rarr; ${newDesc}</li>`);
                }
            });

            // Package Juris Comparison
            const oldJuris = oldData.packageJuris[pkg] || new Set();
            const newJuris = newData.packageJuris[pkg] || new Set();

            const addedJuris = [...newJuris].filter(x => !oldJuris.has(x));
            const removedJuris = [...oldJuris].filter(x => !newJuris.has(x));

            // User Count & ID Comparison
            const oldUser = oldData.packageUsers[pkg];
            const newUser = newData.packageUsers[pkg];
            const userChanged = (oldUser !== undefined || newUser !== undefined) && (oldUser !== newUser);

            const oldId = oldData.packageIds[pkg];
            const newId = newData.packageIds[pkg];
            const idChanged = (oldId !== undefined || newId !== undefined) && (oldId !== newId);

            if (featureDiffs.length > 0 || addedJuris.length > 0 || removedJuris.length > 0 || userChanged || idChanged) {
                html += `<div class="card"><h3>Package Modified: ${pkg}</h3><ul class="diff-list">`;
                
                if (idChanged) {
                    html += `<li class="diff-item modified"><span class="badge">CHANGED</span> Packages ID: ${oldId || '(none)'} &rarr; ${newId || '(none)'}</li>`;
                }

                if (userChanged) {
                    html += `<li class="diff-item modified"><span class="badge">CHANGED</span> No. of User: ${oldUser || '(none)'} &rarr; ${newUser || '(none)'}</li>`;
                }

                removedJuris.forEach(id => {
                    html += `<li class="diff-item removed"><span class="badge">- JURIS REMOVED</span> Package Juris ID: ${id}</li>`;
                });
                addedJuris.forEach(id => {
                    html += `<li class="diff-item added"><span class="badge">+ JURIS ADDED</span> Package Juris ID: ${id}</li>`;
                });

                featureDiffs.forEach(diff => html += diff);

                html += `</ul></div>`;
            }
        }
    });

    if (!html) {
        html = '<div class="card"><p>No differences detected! Configurations are identical.</p></div>';
    }

    resultsDiv.innerHTML = html;
}

function clearAll() {
    document.getElementById('oldText').value = '';
    document.getElementById('newText').value = '';
    document.getElementById('results').innerHTML = '';
}
</script>
</body>
</html>
